name: pkgcheck

# Cancel a superseded run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Manual runs only, checking the selected branch. Automatic triggers are
# suspended until ropensci-review-tools/pkgcheck#444 is fixed (PR #445);
# then restore `push: branches: [main]` and `pull_request`.
on:
  workflow_dispatch:

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Restores the permissiveness of libgit2 < 1.4.3, which gert bundled
      # until 2.4.0. The action's container runs as root against a workspace
      # owned by the runner user, so ownership validation rejects it.
      # HOME inside the container is /github/home, mapped from RUNNER_TEMP.
      - name: register workspace as a safe directory
        run: |
          mkdir -p "${RUNNER_TEMP}/_github_home"
          printf '[safe]\n\tdirectory = /github/workspace\n' \
            >> "${RUNNER_TEMP}/_github_home/.gitconfig"

      - uses: ropensci-review-tools/pkgcheck-action@main
        with:
          summary-only: true
          append-to-issue: true
